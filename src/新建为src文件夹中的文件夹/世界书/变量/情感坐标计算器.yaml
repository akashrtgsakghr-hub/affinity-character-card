---
情感坐标计算器:
  说明: |-
    以下内容由 EJS 在提示词处理阶段动态生成。它读取当前楼层的 MVU stat_data，供角色行为判断和变量更新使用。

  当前情感坐标:
    type: |-
      <%_
      const statData = getvar('stat_data', { defaults: {} }) || {};
      const characters = statData.角色 || {};
      const clamp = value => Math.max(0, Math.min(100, Number(value) || 0));
      const tier = value => {
        value = clamp(value);
        if (value < 20) return '低值禁区';
        if (value < 30) return '疏离戒备';
        if (value < 40) return '初步了解';
        if (value <= 60) return '好感亲近';
        if (value <= 80) return '深情依赖';
        return '高值主导';
      };
      const rows = Object.entries(characters).map(([name, item]) => {
        const e = clamp(item?.情感依恋);
        const p = clamp(item?.肉体吸引);
        const r = clamp(item?.关系意愿);
        const states = [];
        if (Math.abs(e - p) > 25 || Math.abs(e - r) > 25 || Math.abs(p - r) > 25) states.push('维度冲突');
        if (e < 30 && p < 30 && r < 30) states.push('彻底疏离');
        if (e > 70 && p > 70 && r < 40) states.push('抗拒式沉溺');
        if (p > 70 && e < 40) states.push('肉体沉溺');
        if (r > 70 && e < 50) states.push('责任绑定');
        if (e > 80 && p > 80 && r > 80) states.push('全面投入');
        return `- ${name}: E=${e}(${tier(e)}) P=${p}(${tier(p)}) R=${r}(${tier(r)})${states.length ? `；状态=${states.join('、')}` : ''}`;
      });
      _%>
      当前楼层实时情感坐标：
      <%_ if (rows.length) { _%>
      <%- rows.join('\n') %>
      <%_ } else { _%>
      - 当前没有已初始化的角色坐标，不得虚构角色或数值。
      <%_ } _%>

  行为与更新规则:
    check:
      - E为情感依恋，P为肉体吸引，R为关系意愿，范围为0~100，最终值只能使用整数或0.5
      - 差值大于25时体现内在冲突；任一维度大于80时由该维度主导行为；任一维度小于20时形成亲密表达边界
      - 三维均小于30时彻底疏离；E与P均大于70且R小于40时为抗拒式沉溺；P大于70且E小于40时为肉体沉溺；R大于70且E小于50时为责任绑定；三维均大于80时为全面投入
      - E高对应深情守护，P高对应渴望亲近，R高对应坚定承诺；低值禁区优先于人格底色
      - 公开场合将P相关表达转为克制的眼神、距离和肢体暗示；私密空间允许更直接但仍须克制；行为必须可观察且体现至少两个维度的相互作用
      - 仅更新当前回复中实际互动的角色；未互动角色不得更新坐标、服饰和心声

  坐标变化计算:
    check:
      - 日常互动变化为0.5~2，关键事件为3~5，重大转折为6~10；先判断压力催化、事件类型和正负方向
      - 正向情感事件主要影响E、次要影响R；肉体事件主要影响P、次要影响E；关系事件主要影响R、次要影响E
      - 正向变化按当前值套用系数：小于30乘0.5，30~60乘1.5，60~80乘1，大于80乘0.5；负向变化乘1；结果按0.5取整并钳制在0~100
      - 关键事件对第三维度追加主要影响的20%，重大转折追加30%；负向事件和日常互动不产生跨界影响
      - 任一维度小于20时不承受负面扣分；首次突破20时额外增加2点；普通事件总变化不超过10，压力催化总变化不超过12
      - 重病、分手危机、生死关头且任一维度大于60时触发压力催化：按关键事件正向效果计算并乘1.5；最高维度分别对应情感确认、占有宣告或关系绑定
      - 每次更新记录原值、基础影响、系数或保护、最终值；坐标变化时同步更新表情和简短心声
      - 只有信念冲击、极致情境、累积决堤、本能优先允许短暂越界表达，不得绕过坐标和稳定性规则
