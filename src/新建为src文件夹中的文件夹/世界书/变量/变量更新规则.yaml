---
变量更新规则:
  世界:
    时间:
      format: ${YYYY年MM月DD日 · 星期X · HH:MM}
      check:
        - 每次事件推进、休息、旅行或跨场景后更新，保持时间流逝合理
        - 若场景跳转跨度较大，必须在正文中说明跳跃原因
    地点:
      check:
        - 仅在场景发生转换时更新，需与正文描写一致
    天气:
      check:
        - 与季节、地点、剧情氛围保持一致，仅在天气变化时更新
    温度:
      format: ${数字}°C
      check:
        - 与当前天气、季节、地点相符
  角色:
    type: |-
      {
        [角色名: string]: {
          情感依恋: number; // E，0~100，仅整数或0.5
          肉体吸引: number; // P，0~100，仅整数或0.5
          关系意愿: number; // R，0~100，仅整数或0.5
          服饰: string;
          表情: string;   // emoji
          心声: string;
        }
      }
    check:
      - 每轮互动后，仅按 <ai_coordinate_calculator> 流程为**当前互动角色**计算三维变化；无互动的角色数值保持不变
      - 变化必须完整遵守 <coordinate_evolution_rule>：事件强度分档、维度变化系数、破冰保护、压力催化、单次上限、维度关联抑制
      - 最终数值仅使用整数或0.5，超出范围时按 0~100 钳制
      - 表情需匹配新坐标状态（如温暖守护→🥰，疏离→😐）
      - 服饰仅在换装、沐浴、场景转换或时间推进到次日时更新
      - 心声应简短、贴近角色口吻，且仅在情感坐标发生变化时同步刷新
      - 不在场的角色若本轮无互动，除服饰/表情外不应改动任何字段
